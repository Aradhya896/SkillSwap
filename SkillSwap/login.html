<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div id="navbar-container"></div>

    <div class="auth-page">
        <div class="card auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your SkillSwap account</p>
            </div>

            <div class="demo-box">
                <strong>Demo Account:</strong>
                Email: demo@skillswap.com<br>
                Password: 123456
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="you@example.com">
                    <div id="email-error" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                    <div id="password-error" class="error-message"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-2">Login</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            redirectIfAuthenticated();

            const loginForm = document.getElementById('login-form');
            
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const emailError = document.getElementById('email-error');
                const passwordError = document.getElementById('password-error');
                
                emailError.classList.remove('active');
                passwordError.classList.remove('active');
                
                if (!email) {
                    emailError.innerText = "Email is required";
                    emailError.classList.add('active');
                    return;
                }
                
                if (!password) {
                    passwordError.innerText = "Password is required";
                    passwordError.classList.add('active');
                    return;
                }
                
                const users = getUsers();
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    setCurrentUser(user);
                    showToast('Login successful!');
                    setTimeout(() => {
                        window.location.href = 'browse.html';
                    }, 1000);
                } else {
                    showToast('Invalid email or password', 'error');
                    emailError.innerText = "Invalid credentials";
                    emailError.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
