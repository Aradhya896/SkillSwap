<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Skills - SkillSwap</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/browse.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container browse-container">
        <div class="browse-header">
            <h1>Welcome back, <span id="welcome-name"></span>!</h1>
            <p class="text-muted">Find your perfect skill match today.</p>
        </div>

        <div class="dashboard-stats mb-3" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div class="card text-center">
                <h3 style="font-size: 2rem; color: var(--primary-color);" id="stat-offered">0</h3>
                <p class="text-muted">Skills Offered</p>
            </div>
            <div class="card text-center">
                <h3 style="font-size: 2rem; color: var(--warning-color);" id="stat-wanted">0</h3>
                <p class="text-muted">Skills Wanted</p>
            </div>
            <div class="card text-center">
                <h3 style="font-size: 2rem; color: var(--danger-color);" id="stat-pending">0</h3>
                <p class="text-muted">Pending Requests</p>
            </div>
            <div class="card text-center">
                <h3 style="font-size: 2rem; color: var(--success-color);" id="stat-connections">0</h3>
                <p class="text-muted">Connections</p>
            </div>
        </div>

        <section class="search-section">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="form-control" placeholder="Search for skills, people, or locations...">
            </div>
            
            <div class="filter-box">
                <select id="category-filter" class="form-control" style="width: auto;">
                    <option value="">All Categories</option>
                    <option value="programming">Programming</option>
                    <option value="design">Design</option>
                    <option value="business">Business</option>
                    <option value="music">Music</option>
                    <option value="languages">Languages</option>
                    <option value="photography">Photography</option>
                </select>

                <select id="rating-filter" class="form-control" style="width: auto;">
                    <option value="0">Any Rating</option>
                    <option value="4.5">4.5+ Stars</option>
                    <option value="4.0">4.0+ Stars</option>
                    <option value="3.5">3.5+ Stars</option>
                </select>
            </div>
        </section>

        <section>
            <h2 class="mb-2">Recommended Skill Matches</h2>
            <div id="users-grid" class="users-grid">
                <!-- Users will be loaded here via JS -->
            </div>
        </section>
    </main>

    <!-- Request Exchange Modal -->
    <div id="request-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Request Skill Exchange</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p>You are sending a request to <strong><span id="modal-user-name"></span></strong>.</p>
                <div class="mt-1 mb-2">
                    <p class="text-muted" style="font-size: 0.9rem;">They can teach: <span id="modal-teach-skills" style="color: var(--primary-color); font-weight: 500;"></span></p>
                    <p class="text-muted" style="font-size: 0.9rem;">They want to learn: <span id="modal-learn-skills" style="color: var(--warning-color); font-weight: 500;"></span></p>
                </div>
                
                <form id="exchange-form">
                    <div class="form-group">
                        <label for="request-message">Your Message</label>
                        <textarea id="request-message" class="form-control" rows="4" required placeholder="Hi! I can teach you Java and I'd love to learn Python from you."></textarea>
                    </div>
                    <div class="d-flex justify-between gap-1 mt-2">
                        <button type="button" id="cancel-request" class="btn btn-secondary" style="flex:1;">Cancel</button>
                        <button type="submit" class="btn btn-primary" style="flex:1;">Send Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <script src="js/common.js"></script>
    <script src="js/browse.js"></script>
</body>
</html>
