spring.application.name=skillswap
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
# IMPORTANT: Change password if required for local development.

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Secret (In production, inject this via environment variable)
skillswap.app.jwtSecret=SkillSwapSecretKeyForJwtAuthenticationWhichMustBeAtLeast256BitsLongSkillSwap2026
skillswap.app.jwtExpirationMs=86400000

# File Upload sizes (optional)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
